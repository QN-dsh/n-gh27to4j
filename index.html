<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="google" content="notranslate">
<title>给以后的自己</title>
<style>
  :root{
    --ink:#2b2118;
    --ink-soft:#5d4c3b;
    --ink-faint:#9c8670;
    --paper:#f7f2e8;
    --paper-2:#efe7d7;
    --accent:#a8452e;
    --bg:#0e0c0a;
    --line:rgba(139,110,80,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ── 顶部 ── */
  header{
    max-width:1180px;margin:0 auto;
    padding:clamp(40px,8vh,88px) clamp(20px,5vw,48px) clamp(24px,4vh,40px);
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:24px;flex-wrap:wrap;
  }
  .brand h1{
    color:#f0e8db;font-size:clamp(26px,4.6vw,40px);
    font-weight:500;letter-spacing:.1em;line-height:1.3;
  }
  .brand p{
    color:rgba(240,232,219,.42);font-size:clamp(12px,2.4vw,14px);
    letter-spacing:.24em;margin-top:12px;
  }
  .count{
    color:rgba(240,232,219,.34);font-size:13px;letter-spacing:.18em;
    white-space:nowrap;padding-bottom:6px;
  }
  .count b{color:rgba(240,232,219,.8);font-weight:500;font-size:18px}

  /* ── 主体：目录 + 信 ── */
  main{
    max-width:1180px;margin:0 auto;
    padding:0 clamp(20px,5vw,48px) clamp(60px,12vh,120px);
    display:grid;grid-template-columns:minmax(190px,260px) 1fr;
    gap:clamp(24px,4vw,52px);
    align-items:start;
  }

  /* 目录 */
  nav{
    position:sticky;top:32px;
    display:flex;flex-direction:column;gap:2px;
    max-height:calc(100vh - 64px);overflow-y:auto;
    padding-right:6px;
    scrollbar-width:thin;
  }
  nav::-webkit-scrollbar{width:4px}
  nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
  .toc-year{
    color:rgba(240,232,219,.26);font-size:11px;letter-spacing:.3em;
    padding:16px 12px 8px;
  }
  .toc-item{
    display:block;width:100%;text-align:left;
    background:none;border:0;border-left:2px solid transparent;
    padding:11px 12px;cursor:pointer;color:rgba(240,232,219,.5);
    font-family:inherit;font-size:13.5px;line-height:1.5;
    transition:.22s;border-radius:0 3px 3px 0;
  }
  .toc-item:hover{color:rgba(240,232,219,.86);background:rgba(255,255,255,.03)}
  .toc-item .d{display:block;font-size:11px;letter-spacing:.12em;opacity:.6;margin-bottom:3px}
  .toc-item.on{
    color:#f4ecdf;border-left-color:var(--accent);
    background:rgba(168,69,46,.1);
  }

  /* 信纸 */
  .stage{position:relative}
  .sheet{
    background:linear-gradient(175deg,var(--paper),var(--paper-2));
    border-radius:3px;
    padding:clamp(34px,6vw,64px) clamp(26px,5.5vw,60px);
    box-shadow:0 34px 80px rgba(0,0,0,.62), 0 1px 0 rgba(255,255,255,.6) inset;
    position:relative;
    min-height:320px;
  }
  .sheet::before{
    content:"";position:absolute;inset:13px;border:1px solid var(--line);
    border-radius:2px;pointer-events:none;
  }
  .meta{
    display:flex;justify-content:space-between;align-items:baseline;
    gap:16px;padding-bottom:clamp(20px,3.4vh,32px);margin-bottom:clamp(24px,4vh,38px);
    border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .meta .to{
    font-size:13px;letter-spacing:.3em;color:var(--ink-faint);
  }
  .meta .when{
    font-size:12.5px;letter-spacing:.16em;color:var(--ink-faint);
  }
  .title{
    font-size:clamp(21px,3.6vw,29px);color:var(--ink);
    font-weight:600;letter-spacing:.04em;line-height:1.5;
    margin-bottom:clamp(22px,3.6vh,34px);
  }
  .body{font-size:clamp(16.5px,2.5vw,18.5px);line-height:2.15;color:#3a2e23}
  .body p{margin-bottom:1.1em;text-align:justify}
  .body p:last-child{margin-bottom:0}
  .cursor{
    display:inline-block;width:2px;height:1.05em;vertical-align:-.16em;
    background:var(--accent);margin-left:2px;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .empty{
    color:var(--ink-faint);text-align:center;padding:60px 0;
    font-size:15px;letter-spacing:.1em;line-height:2.2;
  }

  /* 翻页 */
  .pager{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:clamp(20px,3.4vh,32px);gap:14px;
  }
  .pager button{
    background:none;border:1px solid rgba(240,232,219,.16);
    color:rgba(240,232,219,.5);font-family:inherit;font-size:13px;
    letter-spacing:.2em;padding:11px 22px;border-radius:999px;
    cursor:pointer;transition:.28s;
  }
  .pager button:hover:not(:disabled){
    border-color:rgba(240,232,219,.42);color:#f0e8db;
  }
  .pager button:disabled{opacity:.22;cursor:default}
  .pager .pos{color:rgba(240,232,219,.26);font-size:12px;letter-spacing:.2em}

  /* 落花 */
  .petal{
    position:fixed;top:-24px;pointer-events:none;z-index:0;
    border-radius:100% 0 100% 0;
  }

  /* ══ 密码门 ══ */
  #gate{
    position:fixed;inset:0;z-index:100;
    display:grid;place-items:center;
    background:radial-gradient(120% 80% at 50% 40%, #1a1614 0%, #080706 70%);
    transition:opacity .7s, visibility .7s;
  }
  #gate.gone{opacity:0;visibility:hidden;pointer-events:none}
  .gate-box{
    text-align:center;padding:0 24px;
    animation:gateIn 1s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes gateIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .gate-title{
    color:#f0e8db;font-size:clamp(22px,5.4vw,30px);
    letter-spacing:.22em;margin-bottom:14px;font-weight:500;
  }
  .gate-sub{
    color:rgba(240,232,219,.32);font-size:12.5px;letter-spacing:.34em;
    margin-bottom:clamp(30px,6vh,46px);
  }
  #pw{
    display:block;width:min(76vw,280px);margin:0 auto 16px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(240,232,219,.16);
    border-radius:2px;padding:13px 16px;
    color:#f0e8db;font-family:inherit;font-size:15px;
    text-align:center;letter-spacing:.2em;outline:none;
    transition:.3s;
  }
  #pw::placeholder{color:rgba(240,232,219,.2);letter-spacing:.1em}
  #pw:focus{border-color:rgba(168,69,46,.7);background:rgba(255,255,255,.06)}
  #go{
    background:none;border:1px solid rgba(240,232,219,.22);
    color:rgba(240,232,219,.72);font-family:inherit;
    font-size:13.5px;letter-spacing:.3em;padding:12px 40px;
    border-radius:999px;cursor:pointer;transition:.3s;
  }
  #go:hover{border-color:rgba(168,69,46,.8);color:#f0e8db;background:rgba(168,69,46,.12)}
  .gate-err{
    height:20px;margin-top:16px;
    color:#d4644a;font-size:12px;letter-spacing:.16em;opacity:0;transition:.3s;
  }
  .gate-err.show{opacity:1}
  body.locked{overflow:hidden}
  body.locked header,body.locked main{visibility:hidden}

  /* 手机 */
  @media (max-width:820px){
    main{
      grid-template-columns:minmax(0,1fr);
      min-width:0;
      padding-left:clamp(14px,4vw,28px);
      padding-right:clamp(14px,4vw,28px);
    }
    .stage{min-width:0;max-width:100%}
    .sheet{
      min-width:0;max-width:100%;overflow-wrap:break-word;
      padding:clamp(26px,6vw,40px) clamp(18px,5vw,30px);
    }
    nav{
      position:static;max-height:none;
      flex-direction:row;flex-wrap:wrap;gap:8px;
      padding:0;margin-bottom:8px;
      overflow:visible;
    }
    .toc-year{width:100%;padding:6px 0 2px}
    .toc-item{
      border-left:0;border:1px solid rgba(240,232,219,.12);
      border-radius:999px;padding:8px 15px;font-size:12.5px;
      width:auto;max-width:100%;
    }
    .toc-item .d{display:none}
    .toc-item.on{border-color:var(--accent);background:rgba(168,69,46,.18)}
    header{padding-bottom:20px}
    .meta{flex-direction:column;align-items:flex-start;gap:8px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body class="locked">

<!-- ══ 密码门 ══ -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-title">给以后的自己</div>
    <div class="gate-sub">这一页需要密码</div>
    <input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="输入密码">
    <button id="go">进 入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<header>
  <div class="brand">
    <h1>给以后的自己</h1>
    <p>攒着，慢慢写</p>
  </div>
  <div class="count"><b id="count">0</b> 封</div>
</header>

<main>
  <nav id="toc"></nav>
  <section class="stage">
    <article class="sheet" id="sheet"></article>
    <div class="pager">
      <button id="prev">上 一 封</button>
      <span class="pos" id="pos"></span>
      <button id="next">下 一 封</button>
    </div>
  </section>
</main>

<script>
/* ═══════════════════════════════════════════════════════════
   在这里加信。复制一个 { ... }, 改内容即可。
   规则：每段话一行、用单引号、行尾逗号、文字里不能有单引号。
   最新的排在最前面。
   ═══════════════════════════════════════════════════════════ */

/* ==== LETTERS START ==== */
const LETTERS = [
  {
    id: '2026-11-14',
    date: '2026-11-14',
    season: '冬',
    title: '第一封：关于这个本子',
    to: '给 你',
    body: [
      '不知道以后会不会真的写很多封。先开个头吧。',
      '这个本子不是写给谁的，是写给自己的。有些话当时说出来显得矫情，放在这里就不算——反正也没人看，除了几年后的我。',
      '今天没什么特别的。晚上做了几张图，跟小D聊到半夜。日子这么过，好像也没什么不好。',
      '如果以后的你翻到这里，想知道这一天发生了什么：那天我在写一个给别人看的情书网站，写着写着发现，其实我是在给自己留东西。',
      '就这样。下面空着，等你来写。'
    ]
  }
];
/* ==== LETTERS END ==== */

(function () {
  const toc = document.getElementById('toc');
  const sheet = document.getElementById('sheet');
  const posEl = document.getElementById('pos');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const countEl = document.getElementById('count');

  /* ══ 密码门 ══
     说明：这是前端校验，能挡住随手打开的人，但挡不住看源码的人。
     真正保密的内容不要发公网。密码改了记得同时改这里的值。 */
  const PASS = 'xiaod2026';          // ← 想换密码就改这里
  const GATE_KEY = 'qingshu-ok';

  const gate = document.getElementById('gate');
  const pw = document.getElementById('pw');
  const go = document.getElementById('go');
  const gateErr = document.getElementById('gateErr');

  function unlock(silent) {
    gate.classList.add('gone');
    document.body.classList.remove('locked');
    try { sessionStorage.setItem(GATE_KEY, '1'); } catch (e) {}
    requestAnimationFrame(() => { boot(); });
  }

  function tryOpen() {
    if (pw.value === PASS) { unlock(); return; }
    gateErr.textContent = '不对';
    gateErr.classList.add('show');
    pw.value = '';
    pw.focus();
    setTimeout(() => gateErr.classList.remove('show'), 1800);
  }

  go.addEventListener('click', tryOpen);
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') tryOpen(); });

  let wasOk = false;
  try { wasOk = sessionStorage.getItem(GATE_KEY) === '1'; } catch (e) {}
  if (wasOk) { gate.classList.add('gone'); document.body.classList.remove('locked'); setTimeout(boot, 60); }
  else { pw.focus(); }

  // ── 正文启动 ──
  let booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    init();
  }

  // ── 目录 / 阅读 ──
  function init() {
    const list = LETTERS.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
    let cur = 0;
    let typer = null;

    countEl.textContent = list.length;

    function render() {
      if (!list.length) {
        sheet.innerHTML = '<div class="empty">还没有信。<br>打开 index.html，按「LETTERS START」处的格式加一封。</div>';
        posEl.textContent = '';
        return;
      }
      const L = list[cur];
      const when = `${L.date}${L.season ? ' · ' + L.season : ''}`;

      sheet.innerHTML = `
        <div class="meta">
          <span class="to">${esc(L.to || '给 你')}</span>
          <span class="when">${esc(when)}</span>
        </div>
        <h2 class="title">${esc(L.title || '')}</h2>
        <div class="body" id="bodyText"></div>
      `;

      typeOut(L.body || []);
      posEl.textContent = `${cur + 1} / ${list.length}`;
      prevBtn.disabled = cur === 0;
      nextBtn.disabled = cur >= list.length - 1;
      markToc();
    }

    function markToc() {
      [...toc.querySelectorAll('.toc-item')].forEach((el, k) => {
        el.classList.toggle('on', k === cur);
      });
    }

    // 建目录
    let lastYear = null;
    list.forEach((L, k) => {
      const y = (L.date || '').slice(0, 4);
      if (y && y !== lastYear) {
        const h = document.createElement('div');
        h.className = 'toc-year';
        h.textContent = y;
        toc.appendChild(h);
        lastYear = y;
      }
      const b = document.createElement('button');
      b.className = 'toc-item';
      b.innerHTML = `<span class="d">${esc(L.date)}</span>${esc(L.title || '无题')}`;
      b.addEventListener('click', () => { cur = k; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      toc.appendChild(b);
    });

    prevBtn.addEventListener('click', () => { if (cur > 0) { cur--; render(); } });
    nextBtn.addEventListener('click', () => { if (cur < list.length - 1) { cur++; render(); } });

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && cur > 0) { cur--; render(); }
      if (e.key === 'ArrowRight' && cur < list.length - 1) { cur++; render(); }
    });

    // 逐字浮现（分段结构从一开始就是对的）
    function typeOut(paras) {
      const host = document.getElementById('bodyText');
      if (typer) { clearInterval(typer); typer = null; }
      host.innerHTML = paras.map(() => '<p></p>').join('');
      const ps = [...host.children];
      let pi = 0, ci = 0;
      const speed = paras.join('').length > 240 ? 10 : 20;
      typer = setInterval(() => {
        if (pi >= paras.length) { clearInterval(typer); typer = null; return; }
        const text = paras[pi];
        if (ci < text.length) { ps[pi].textContent += text[ci++]; }
        else { pi++; ci = 0; }
      }, speed);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    render();
    petals(18);
  }
})();

// 落花
function petals(n) {
  for (let i = 0; i < n; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 5 + Math.random() * 7;
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.width = size + 'px';
    p.style.height = size * 0.7 + 'px';
    p.style.background = `hsl(${8 + Math.random() * 18} 55% ${68 + Math.random() * 14}%)`;
    p.style.opacity = 0;
    p.style.animation = `drift ${12 + Math.random() * 12}s linear ${Math.random() * 10}s infinite`;
    document.body.appendChild(p);
  }
  const st = document.createElement('style');
  st.textContent = `@keyframes drift{
    0%{transform:translateY(-6vh) rotate(0);opacity:0}
    10%{opacity:.5}
    90%{opacity:.2}
    100%{transform:translateY(108vh) rotate(360deg);opacity:0}
  }`;
  document.head.appendChild(st);
}
</script>
</body>
</html>
